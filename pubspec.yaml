name: blog
description: A new Jaspr project
version: 0.0.1

environment:
  sdk: ^3.10.0

dependencies:
  jaspr: ^0.23.4
  jaspr_router: ^0.9.0
  markdown: any

dev_dependencies:
  build_runner: ^2.10.0
  build_web_compilers: ^4.8.5
  jaspr_builder: ^0.23.4
  lints: ^5.0.0

jaspr:
  mode: static
  # Non-standard app-server port so this project can run alongside other
  # Jaspr apps without colliding on the default 8080. The matching dev proxy
  # port (--proxy-port) is set in tool/serve.sh, since jaspr does not read it
  # from pubspec.yaml.
  port: 8090
